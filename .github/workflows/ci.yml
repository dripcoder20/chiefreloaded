name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored tree is regenerated from this submodule to verify it
          # has not been hand-edited, so it must be checked out.
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify vendored tree matches upstream
        run: ./scripts/sync-upstream.sh --check

      - name: Vet
        run: go vet $(go list ./... | grep -v /internal/chief/)

      - name: Test
        run: go test ./...

      - name: Race
        run: |
          # Only our own concurrency-heavy packages; the vendored tree is
          # covered by the plain `go test` above.
          pkgs=$(go list ./internal/session/... ./internal/ghstack/... ./internal/authoring/... 2>/dev/null || true)
          if [ -n "$pkgs" ]; then go test -race $pkgs; fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
