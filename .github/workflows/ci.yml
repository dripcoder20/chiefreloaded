name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored tree is regenerated from this submodule to verify it
          # has not been hand-edited, so it must be checked out.
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # actions/checkout clones submodules shallow and without tags, so
      # `git describe --tags` in third_party/chief falls back to a bare SHA and
      # the regenerated manifest disagrees with the committed one over nothing.
      # Fetch the tags so the ref resolves to v0.8.0 here as it does locally.
      - name: Fetch upstream tags
        run: git -C third_party/chief fetch --tags --force --depth=1 origin

      - name: Verify vendored tree matches upstream
        run: ./scripts/sync-upstream.sh --check

      # The root package embeds frontend/dist, which is a build artefact and so
      # gitignored. Vet and test only need the embed to resolve, not real
      # assets — building the whole frontend here would duplicate the Frontend
      # job without covering anything extra.
      - name: Placeholder for the embedded frontend
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Vet
        run: go vet $(go list ./... | grep -v /internal/chief/)

      - name: Test
        run: go test ./...

      - name: Race
        run: |
          # Only our own concurrency-heavy packages; the vendored tree is
          # covered by the plain `go test` above.
          pkgs=$(go list ./internal/session/... ./internal/ghstack/... ./internal/authoring/... 2>/dev/null || true)
          if [ -n "$pkgs" ]; then go test -race $pkgs; fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/bindings/ is generated by wails3 and gitignored, so it is
      # absent here. Both the Vite build and svelte-check import it, so it has
      # to be generated before either runs — which needs Go and the pinned
      # wails3, same version as the Taskfile.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The wails3 CLI links against gtk4 and webkitgtk-6.0 — a different pair
      # from the gtk3/webkit2gtk-4.1 the application itself targets — so both
      # sets are needed to build it here.
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Generate TypeScript bindings
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.121
          "$(go env GOPATH)"/bin/wails3 generate bindings -ts

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
